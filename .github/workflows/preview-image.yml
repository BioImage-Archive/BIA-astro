name: Build preview image

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Open PR number to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-image-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
       github.event.pull_request.head.repo.full_name == 'bijux/bijux-bia-astro'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve the current allowlisted PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          number = os.environ['PR_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]*', number):
              raise SystemExit('Invalid PR number')
          req = urllib.request.Request('https://api.github.com/repos/BioImage-Archive/BIA-astro/pulls/' + number,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              pr = json.load(response)
          repo = (pr['head']['repo'] or {}).get('full_name')
          sha = pr['head']['sha']
          if (pr['state'] != 'open' or pr['draft'] or pr['base']['ref'] != 'main'
              or repo not in {'BioImage-Archive/BIA-astro', 'bijux/bijux-bia-astro'}
              or not re.fullmatch(r'[0-9a-f]{40}', sha)):
              raise SystemExit('PR is not eligible for a preview')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'number={number}\nrepo={repo}\nsha={sha}\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false
      - name: Test and build without registry credentials
        run: |
          docker build -f Dockerfile.preview --tag preview-build:artifact .
          docker save --output "$RUNNER_TEMP/image.tar" preview-build:artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-pr-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - name: Preview access instructions
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          {
            echo "### Preview built for PR #${PR_NUMBER}"
            echo "Commit: \`${HEAD_SHA}\`"
            echo 'The Publish preview image workflow validates this build and publishes it to GHCR.'
            echo 'Kubernetes checks published images every five minutes. Check pod readiness before reviewing.'
            echo '```sh'
            echo "kubectl -n bia-previews get deployment astro-pr-${PR_NUMBER}"
            echo "kubectl -n bia-previews port-forward svc/astro-pr-${PR_NUMBER} 4322:8080"
            echo '```'
            echo 'Open http://localhost:4322/bioimage-archive/ and confirm the commit in the banner.'
          } >> "$GITHUB_STEP_SUMMARY"
