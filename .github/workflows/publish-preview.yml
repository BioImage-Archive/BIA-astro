name: Publish preview image
on:
  workflow_run:
    workflows: [Build preview image]
    types: [completed]
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: publish-preview-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate and publish the image without executing it
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 .github/scripts/publish_preview.py
